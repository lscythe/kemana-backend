[tools]
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy" }
hk = "2.11.1"
python = "3.15.2"
taplo = "0.10.0"
"aqua:owenlamont/ryl" = "0.29.0"
"cargo:cargo-llvm-cov" = "0.9.1"

[hooks]
postinstall = "hk install --mise"

[tasks.format]
description = "Format sources with rustfmt"
run = "cargo fmt"

[tasks.check]
description = "Run the static checks"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the commit scope tests and the Rust tests"
run = [
  "python3 -m unittest discover -s .github/scripts -p 'test_*.py'",
  "cargo test",
]

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.coverage]
description = "Write an lcov coverage report"
run = "cargo llvm-cov --lcov --output-path lcov.info"
